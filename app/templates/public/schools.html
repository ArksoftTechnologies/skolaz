{% extends "base/base.html" %}

{% block title %}Browse Schools — Skolaz{% endblock %}

{% block content %}
<!-- Header Navigation (white bg variant) -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 py-4 flex items-center justify-between">
        <a href="{{ url_for('public.home') }}" class="flex items-center gap-3">
            <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center shadow-lg shadow-brand-600/30">
                <svg class="w-4.5 h-4.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            </div>
            <span class="font-bold text-slate-900 text-lg tracking-tight">Skolaz</span>
        </a>
        <div class="flex items-center gap-4">
            <a href="{{ url_for('auth.login') }}" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors hidden sm:block">Sign in</a>
            <a href="{{ url_for('auth.signup') }}" class="px-4 py-2 bg-brand-600 text-white text-sm font-semibold rounded-lg hover:bg-brand-700 transition-colors shadow-sm">
                Register
            </a>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 lg:px-8 py-12">
    <!-- Page Header -->
    <div class="mb-10 text-center">
        <h1 class="text-4xl font-bold tracking-tight text-slate-900 mb-4">Discover Global Institutions</h1>
        <p class="text-lg text-slate-600 max-w-2xl mx-auto">Explore top universities and colleges matching your academic goals.</p>
    </div>

    <!-- Search / Filter Form -->
    <div class="mb-10 max-w-3xl mx-auto">
        <form action="{{ url_for('public.schools') }}" method="GET" class="flex items-center gap-3">
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                    <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <input type="search" name="q" value="{{ q }}" placeholder="Search for schools..." class="input-base h-12 pl-11 shadow-sm">
            </div>
            <button type="submit" class="btn-primary h-12 px-6">Search</button>
        </form>
    </div>

    <!-- Grid Container -->
    <div id="schools-grid">
        {% include "public/_schools_grid.html" %}
    </div>

</main>
{% endblock %}
