<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Skolaz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: {
                    brand: { 500: '#3b82f6', 600: '#2563eb' },
                    navy: { 900: '#0F172A', 950: '#070d1a' }
                },
                fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
            }}
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="min-h-screen bg-navy-900 flex items-center justify-center p-6">
    <div class="text-center max-w-md">
        <!-- Error Code -->
        <div class="text-[8rem] font-bold text-white/[0.06] leading-none select-none mb-0">404</div>

        <!-- Icon -->
        <div class="w-16 h-16 rounded-2xl bg-brand-600/15 border border-brand-500/20 flex items-center justify-center mx-auto -mt-4 mb-6">
            <svg class="w-8 h-8 text-brand-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-white mb-3">Page not found</h1>
        <p class="text-slate-400 text-sm leading-relaxed mb-8">
            The page you're looking for doesn't exist or has been moved. Please check the URL or go back to the dashboard.
        </p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="javascript:history.back()"
               class="px-5 py-2.5 bg-white/5 text-white border border-white/10 rounded-lg text-sm font-medium hover:bg-white/10 transition-colors">
                ← Go Back
            </a>
            <a href="/"
               class="px-5 py-2.5 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition-colors shadow-lg shadow-brand-600/20">
                Home Page
            </a>
        </div>

        <p class="text-slate-600 text-xs mt-10">
            Skolaz v2.0 &mdash; Error 404
        </p>
    </div>
</body>
</html>
