services:
  - type: web
    name: skolaz
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 --bind 0.0.0.0:$PORT wsgi:application
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skolaz-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: STORAGE_BACKEND
        value: local
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: skolaz-db
    plan: free
    databaseName: skolaz
